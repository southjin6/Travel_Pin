# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    ports:
      # Loopback only. The tunnel reaches the app over the compose network as
      # server:8000, so nothing needs to be published to the LAN or the internet.
      # Local browsing at http://localhost:8000 still works.
      - "127.0.0.1:8000:8000"
    # SECRET_KEY and ADMIN_PASSWORD come from .env (copy .env.example, which
    # .dockerignore keeps out of the image). Without SECRET_KEY the container
    # exits immediately with an explanation.
    env_file:
      - .env
    environment:
      # Matches the directory the Dockerfile creates and chowns to appuser.
      TRAVEL_DB: /data/travel.db
    volumes:
      # Accounts, pins, lockout state and the API cache all live in this file,
      # so it must outlive the container.
      - travel-data:/data
    restart: unless-stopped

  # Quick tunnel: no domain, no Cloudflare account, no inbound ports. cloudflared
  # dials *out* to Cloudflare and traffic returns down that connection, which is
  # why this works behind CGNAT or a rotating residential IP.
  #
  # Caveat: the https://<random>.trycloudflare.com hostname changes on every
  # container start. Read the current one with:
  #   docker compose logs cloudflared | Select-String trycloudflare
  # Replace this whole service with a token-based named tunnel once you own a
  # domain and want a hostname that stays put.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://server:8000
    depends_on:
      server:
        # The Dockerfile HEALTHCHECK proves the schema exists, so the tunnel
        # never comes up in front of an app that cannot serve.
        condition: service_healthy

volumes:
  travel-data:

